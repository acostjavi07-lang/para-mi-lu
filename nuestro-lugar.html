<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Nuestro Lugar</title>
<style>
  :root{
    --bg1:#1a0508; --bg2:#3a0d12; --ink:#f6ece6; --ink-dim:#cdb8b2;
    --isa-accent:#ff8a6a; --isa-glow:#b8232f;
    --lu-accent:#ff6f9c; --lu-glow:#a01a4a;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none;}
  html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#050203;
    font-family:'Segoe UI',system-ui,-apple-system,Arial,sans-serif; color:var(--ink); touch-action:none;}

  canvas#roomCanvas{position:fixed; inset:0; display:block;}

  /* ---- pantalla de identidad ---- */
  #identityScreen{position:fixed; inset:0; z-index:50; display:flex; flex-direction:column; align-items:center;
    justify-content:center; background:radial-gradient(ellipse at 50% 30%, #2c0a10, #050203 80%); padding:24px; text-align:center;}
  #identityScreen h1{font-size:clamp(1.6rem,7vw,2.3rem); letter-spacing:4px; margin:0 0 6px 0; font-weight:800;
    text-shadow:0 0 24px rgba(255,80,90,0.5);}
  #identityScreen p{color:var(--ink-dim); font-size:0.9rem; margin-bottom:30px;}
  .idBtns{display:flex; flex-direction:column; gap:14px; width:min(280px,80vw);}
  .idBtn{padding:16px; border-radius:16px; border:1px solid rgba(255,255,255,0.18); font-size:1.05rem; font-weight:700;
    letter-spacing:1px; cursor:pointer; color:#fff;}
  #btnIsa{background:linear-gradient(180deg,var(--isa-accent),var(--isa-glow));}
  #btnLu{background:linear-gradient(180deg,var(--lu-accent),var(--lu-glow));}
  #hidden .hidden{display:none !important;}

  /* ---- HUD ---- */
  #hud{position:fixed; inset:0; z-index:20; pointer-events:none;}
  #homeLink{position:fixed; top:16px; left:16px; width:38px; height:38px; border-radius:50%;
    background:rgba(0,0,0,0.4); border:1px solid rgba(255,255,255,0.15); color:var(--ink);
    display:flex; align-items:center; justify-content:center; font-size:1rem; text-decoration:none; pointer-events:auto;}
  #roomTitle{position:fixed; top:16px; left:64px; font-size:0.78rem; letter-spacing:2px; color:var(--ink-dim);
    background:rgba(0,0,0,0.35); padding:8px 14px; border-radius:20px; border:1px solid rgba(255,255,255,0.1);}

  #soundBar{position:fixed; top:16px; right:16px; display:flex; gap:8px; pointer-events:auto;}
  .soundBtn{width:38px; height:38px; border-radius:50%; background:rgba(0,0,0,0.4);
    border:1px solid rgba(255,255,255,0.15); color:var(--ink); font-size:1rem; display:flex;
    align-items:center; justify-content:center; opacity:0.45; transition:opacity .2s ease, box-shadow .2s ease;}
  .soundBtn.on{opacity:1; box-shadow:0 0 14px 2px rgba(255,120,90,0.5);}

  #chatToggleBtn{position:fixed; right:20px; bottom:130px; width:56px; height:56px; border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #ff8f7a, #b8232f); border:2px solid rgba(255,255,255,0.3);
    color:#fff; font-size:1.3rem; display:flex; align-items:center; justify-content:center; pointer-events:auto;
    box-shadow:0 6px 18px rgba(0,0,0,0.5);}
  #chatToggleBtn .unread{position:absolute; top:-4px; right:-4px; background:var(--lu-accent); color:#fff;
    font-size:0.65rem; font-weight:800; min-width:18px; height:18px; border-radius:9px; display:none;
    align-items:center; justify-content:center; padding:0 4px;}
  #chatToggleBtn .unread.show{display:flex;}

  #emojiBar{position:fixed; left:50%; bottom:14px; transform:translateX(-50%); display:flex; gap:6px;
    background:rgba(0,0,0,0.35); padding:8px 10px; border-radius:26px; border:1px solid rgba(255,255,255,0.12);
    pointer-events:auto;}
  .emojiBtn{width:38px; height:38px; border-radius:50%; background:rgba(255,255,255,0.06); border:none;
    font-size:1.15rem; display:flex; align-items:center; justify-content:center;}
  .emojiBtn:active{transform:scale(0.85);}

  #joystickBase{position:fixed; left:24px; bottom:24px; width:104px; height:104px; border-radius:50%;
    background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.18); pointer-events:auto;}
  #joystickKnob{position:absolute; left:50%; top:50%; width:48px; height:48px; border-radius:50%;
    background:rgba(255,255,255,0.22); border:1px solid rgba(255,255,255,0.4); transform:translate(-50%,-50%);}
  @media (min-width:900px){ #joystickBase{opacity:0.15;} }

  /* burbujas de texto sobre los puntos */
  .speechBubble{position:fixed; z-index:22; max-width:180px; background:rgba(20,8,10,0.92);
    border:1px solid rgba(255,150,120,0.3); border-radius:12px; padding:6px 10px; font-size:0.78rem;
    line-height:1.3; color:var(--ink); opacity:0; transition:opacity .3s ease; pointer-events:none;
    transform:translate(-50%,-100%);}
  .speechBubble.show{opacity:1;}

  /* ---- chat panel ---- */
  #chatPanel{position:fixed; inset:0; z-index:40; display:flex; align-items:flex-end; justify-content:center;
    background:rgba(0,0,0,0); pointer-events:none; transition:background .25s ease;}
  #chatPanel.open{background:rgba(0,0,0,0.5); pointer-events:auto;}
  .chatCard{width:100%; max-width:480px; height:60vh; background:linear-gradient(180deg,#1c0a0d,#0c0405);
    border-radius:22px 22px 0 0; display:flex; flex-direction:column; transform:translateY(100%);
    transition:transform .3s cubic-bezier(.2,.9,.3,1); border-top:1px solid rgba(255,150,120,0.25);}
  #chatPanel.open .chatCard{transform:translateY(0);}
  .chatHeader{display:flex; align-items:center; justify-content:space-between; padding:14px 18px;
    border-bottom:1px solid rgba(255,255,255,0.08); flex-shrink:0;}
  .chatHeader span{font-size:0.9rem; letter-spacing:1px; color:var(--ink-dim);}
  #chatCloseBtn{background:none; border:none; color:var(--ink); font-size:1.2rem;}
  #chatLog{flex:1; overflow-y:auto; padding:14px 18px; display:flex; flex-direction:column; gap:8px;}
  .chatMsg{max-width:78%; padding:8px 12px; border-radius:12px; font-size:0.9rem; line-height:1.4;}
  .chatMsg.mine{align-self:flex-end; background:linear-gradient(180deg,#ff8a6a,#b8232f); color:#fff;}
  .chatMsg.theirs{align-self:flex-start; background:rgba(255,255,255,0.08);}
  .chatInputRow{display:flex; gap:8px; padding:12px 14px; border-top:1px solid rgba(255,255,255,0.08); flex-shrink:0;
    padding-bottom:calc(env(safe-area-inset-bottom,0) + 12px);}
  #chatInput{flex:1; border-radius:20px; border:1px solid rgba(255,255,255,0.15); background:rgba(255,255,255,0.05);
    color:var(--ink); padding:10px 16px; font-size:0.95rem; outline:none;}
  #chatSendBtn{width:44px; height:44px; border-radius:50%; border:none;
    background:linear-gradient(180deg,#ff8a6a,#b8232f); color:#fff; font-size:1.1rem;}
</style>
</head>
<body>

<canvas id="roomCanvas"></canvas>

<div id="identityScreen">
  <h1>NUESTRO LUGAR</h1>
  <p>¿Quién sos?</p>
  <div class="idBtns">
    <button class="idBtn" id="btnIsa">Isaías</button>
    <button class="idBtn" id="btnLu">Lu❤</button>
  </div>
</div>

<div id="hud" class="hidden">
  <a href="index.html" id="homeLink">🏠</a>
  <div id="roomTitle">NUESTRO LUGAR</div>

  <div id="soundBar">
    <button class="soundBtn" id="btnRain" title="Lluvia">🌧️</button>
    <button class="soundBtn" id="btnMusic" title="Música">🎵</button>
    <button class="soundBtn" id="btnFire" title="Fogata">🔥</button>
  </div>

  <div id="joystickBase"><div id="joystickKnob"></div></div>

  <div id="emojiBar"></div>

  <button id="chatToggleBtn">💬<span class="unread" id="unreadBadge">0</span></button>
</div>

<div id="chatPanel">
  <div class="chatCard">
    <div class="chatHeader">
      <span>CHAT</span>
      <button id="chatCloseBtn">✕</button>
    </div>
    <div id="chatLog"></div>
    <div class="chatInputRow">
      <input type="text" id="chatInput" placeholder="escribí algo..." maxlength="200">
      <button id="chatSendBtn">➜</button>
    </div>
  </div>
</div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-database-compat.js"></script>

<script>
(function(){
"use strict";

/* ============================================================
   CONFIG DE FIREBASE (la misma que ya usás en notas.html)
   ============================================================ */
const firebaseConfig = {
  apiKey: "AIzaSyBMipVWd7Ms7AB1FTvOv3eAI-gFv3vQ83s",
  authDomain: "para-lu-notas.firebaseapp.com",
  databaseURL: "https://para-lu-notas-default-rtdb.firebaseio.com",
  projectId: "para-lu-notas",
  storageBucket: "para-lu-notas.firebasestorage.app",
  messagingSenderId: "203773545551",
  appId: "1:203773545551:web:59d775eda5f06d3c00ae3a"
};

let db = null;
try{
  firebase.initializeApp(firebaseConfig);
  db = firebase.database();
}catch(e){ db = null; }

const NAMES = { isaias:"Isaías", lu:"Lu❤" };
const COLORS = {
  isaias: { accent:"#ff8a6a", glow:"#b8232f" },
  lu: { accent:"#ff6f9c", glow:"#a01a4a" }
};
const EMOJIS = ["❤️","😂","😢","😮","👍","🎉","😴","🥩"];

let myId = null, otherId = null;
const pageLoadTs = Date.now();

/* ============================================================
   PANTALLA DE IDENTIDAD
   ============================================================ */
function chooseIdentity(id){
  myId = id;
  otherId = id === "isaias" ? "lu" : "isaias";
  try{ localStorage.setItem("nuestro_lugar_id", id); }catch(e){}
  document.getElementById("identityScreen").classList.add("hidden");
  document.getElementById("hud").classList.remove("hidden");
  buildEmojiBar();
  startRoom();
}
document.getElementById("btnIsa").addEventListener("click", ()=> chooseIdentity("isaias"));
document.getElementById("btnLu").addEventListener("click", ()=> chooseIdentity("lu"));

(function autoRestore(){
  let saved = null;
  try{ saved = localStorage.getItem("nuestro_lugar_id"); }catch(e){}
  if(saved === "isaias" || saved === "lu"){
    document.getElementById("identityScreen").querySelector("p").textContent =
      "Entrando como " + NAMES[saved] + "...";
    setTimeout(()=> chooseIdentity(saved), 500);
  }
})();

/* ============================================================
   CANVAS / RENDER
   ============================================================ */
const canvas = document.getElementById("roomCanvas");
const ctx = canvas.getContext("2d");
let W=window.innerWidth, H=window.innerHeight;
function resize(){
  const dpr = Math.min(window.devicePixelRatio||1, 2);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = Math.floor(W*dpr); canvas.height = Math.floor(H*dpr);
  canvas.style.width = W+"px"; canvas.style.height = H+"px";
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
window.addEventListener("resize", resize);
resize();

let rainDrops = [], dustParticles = [];
function buildRain(){
  const count = Math.min(80, Math.floor(W*H/9000));
  rainDrops = [];
  for(let i=0;i<count;i++){
    rainDrops.push({ x:Math.random()*W, y:Math.random()*H, len:10+Math.random()*18,
      speed:380+Math.random()*280, sway:-24+Math.random()*10 });
  }
}
function buildDust(){
  dustParticles = [];
  for(let i=0;i<36;i++){
    dustParticles.push({ x:Math.random()*W, y:Math.random()*H, r:0.6+Math.random()*1.6,
      vx:-3+Math.random()*6, vy:-5+Math.random()*-3, phase:Math.random()*Math.PI*2 });
  }
}
buildRain(); buildDust();

const players = {
  isaias: { fx:0.35, fy:0.6, rx:0.35, ry:0.6, emoji:null, emojiTs:0 },
  lu:     { fx:0.65, fy:0.6, rx:0.65, ry:0.6, emoji:null, emojiTs:0 }
};

function drawBackground(){
  const g = ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,"#3a0d12"); g.addColorStop(1,"#1a0508");
  ctx.fillStyle = g; ctx.fillRect(0,0,W,H);
  const glow = ctx.createRadialGradient(W*0.5,H*0.35,10, W*0.5,H*0.35, Math.max(W,H)*0.75);
  glow.addColorStop(0,"rgba(255,140,110,0.16)"); glow.addColorStop(1,"rgba(0,0,0,0)");
  ctx.fillStyle = glow; ctx.fillRect(0,0,W,H);
}
function updateRain(dt){
  for(const d of rainDrops){
    d.y += d.speed*dt; d.x += d.sway*dt;
    if(d.y>H){ d.y=-20; d.x=Math.random()*W; }
    if(d.x<-20) d.x=W+20;
  }
}
function drawRain(){
  ctx.strokeStyle = "rgba(180,190,230,0.28)"; ctx.lineWidth=1.1;
  ctx.beginPath();
  for(const d of rainDrops){ ctx.moveTo(d.x,d.y); ctx.lineTo(d.x+d.sway*0.15, d.y+d.len); }
  ctx.stroke();
}
function updateDust(dt){
  for(const p of dustParticles){
    p.phase += dt;
    p.x += p.vx*dt + Math.sin(p.phase)*4*dt;
    p.y += p.vy*dt;
    if(p.y<-10){ p.y=H+10; p.x=Math.random()*W; }
  }
}
function drawDust(){
  ctx.fillStyle = "rgba(255,210,180,0.3)";
  for(const p of dustParticles){ ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2); ctx.fill(); }
}

function drawPlayer(id){
  const p = players[id];
  const px = p.fx*W, py = p.fy*H;
  const col = COLORS[id];
  const glow = ctx.createRadialGradient(px,py,0,px,py,30);
  glow.addColorStop(0, col.accent+"cc"); glow.addColorStop(1, col.accent+"00");
  ctx.fillStyle = glow;
  ctx.beginPath(); ctx.arc(px,py,30,0,Math.PI*2); ctx.fill();

  ctx.fillStyle = col.accent;
  ctx.beginPath(); ctx.arc(px,py,12,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle = "rgba(255,255,255,0.5)"; ctx.lineWidth=2; ctx.stroke();

  const hasEmoji = p.emoji && (Date.now()-p.emojiTs < 4000);
  if(hasEmoji){
    ctx.font = "18px system-ui, sans-serif";
    ctx.textAlign="center"; ctx.textBaseline="middle";
    ctx.fillText(p.emoji, px, py-1);
  }

  ctx.font="12px system-ui, sans-serif"; ctx.textAlign="center";
  ctx.fillStyle = "rgba(255,255,255,0.85)";
  ctx.fillText(NAMES[id], px, py+30);
}

let lastTs = performance.now();
function loop(ts){
  const dt = Math.min((ts-lastTs)/1000, 0.05); lastTs = ts;

  handleMovement(dt);
  updateRain(dt); updateDust(dt);

  // interpolar posición del otro jugador
  if(otherId){
    const o = players[otherId];
    o.fx += (o.rx - o.fx) * Math.min(1, dt*8);
    o.fy += (o.ry - o.fy) * Math.min(1, dt*8);
  }

  drawBackground(); drawDust(); drawRain();
  if(myId){ drawPlayer(otherId); drawPlayer(myId); }
  updateBubblePositions();

  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

/* ============================================================
   MOVIMIENTO
   ============================================================ */
const keys = new Set();
window.addEventListener("keydown", e=> keys.add(e.key.toLowerCase()));
window.addEventListener("keyup", e=> keys.delete(e.key.toLowerCase()));

const joyBase = document.getElementById("joystickBase");
const joyKnob = document.getElementById("joystickKnob");
let joyActive=false, joyVec={x:0,y:0}, joyId=null, joyCenter={x:0,y:0};
joyBase.addEventListener("pointerdown",(e)=>{
  joyActive=true; joyId=e.pointerId;
  const r = joyBase.getBoundingClientRect();
  joyCenter = { x:r.left+r.width/2, y:r.top+r.height/2 };
  updateJoy(e.clientX,e.clientY);
  joyBase.setPointerCapture(e.pointerId);
});
joyBase.addEventListener("pointermove",(e)=>{ if(joyActive && e.pointerId===joyId) updateJoy(e.clientX,e.clientY); });
function endJoy(e){ if(!joyId || e.pointerId===joyId){ joyActive=false; joyVec={x:0,y:0}; joyId=null;
  joyKnob.style.transform="translate(-50%,-50%)"; } }
joyBase.addEventListener("pointerup", endJoy);
joyBase.addEventListener("pointercancel", endJoy);
function updateJoy(cx,cy){
  const maxR=32; let dx=cx-joyCenter.x, dy=cy-joyCenter.y;
  const dist=Math.hypot(dx,dy);
  if(dist>maxR){ dx=dx/dist*maxR; dy=dy/dist*maxR; }
  joyKnob.style.transform = `translate(${dx-24}px, ${dy-24}px)`;
  joyVec = { x:dx/maxR, y:dy/maxR };
}

let lastWrite = 0;
function handleMovement(dt){
  if(!myId) return;
  let dx=0, dy=0;
  if(keys.has("w")||keys.has("arrowup")) dy-=1;
  if(keys.has("s")||keys.has("arrowdown")) dy+=1;
  if(keys.has("a")||keys.has("arrowleft")) dx-=1;
  if(keys.has("d")||keys.has("arrowright")) dx+=1;
  if(joyActive){ dx=joyVec.x; dy=joyVec.y; }
  const mag = Math.hypot(dx,dy);
  if(mag>0.08){
    dx/=Math.max(mag,1); dy/=Math.max(mag,1);
    const speed = 150;
    const me = players[myId];
    me.fx += (dx*speed*dt)/W; me.fy += (dy*speed*dt)/H;
    me.fx = Math.max(0.05, Math.min(0.95, me.fx));
    me.fy = Math.max(0.12, Math.min(0.92, me.fy));
    me.rx = me.fx; me.ry = me.fy;

    const now = Date.now();
    if(db && now-lastWrite > 120){
      lastWrite = now;
      db.ref("room/players/"+myId).update({ x:me.fx, y:me.fy, ts: now });
    }
  }
}

/* ============================================================
   SINCRONIZAR POSICIÓN DEL OTRO JUGADOR
   ============================================================ */
function startRoom(){
  if(!db) return;
  db.ref("room/players/"+otherId).on("value",(snap)=>{
    const v = snap.val();
    if(v && typeof v.x==="number" && typeof v.y==="number"){
      players[otherId].rx = v.x; players[otherId].ry = v.y;
    }
  });
  db.ref("room/players/"+otherId+"/emoji").on("value",(snap)=>{
    players[otherId].emoji = snap.val() || null;
  });
  db.ref("room/players/"+otherId+"/emojiTs").on("value",(snap)=>{
    players[otherId].emojiTs = snap.val() || 0;
  });

  const chatRef = db.ref("room/chat").limitToLast(50);
  chatRef.on("child_added",(snap)=>{
    const msg = snap.val();
    if(!msg) return;
    appendChatLog(msg);
    if(msg.ts && msg.ts >= pageLoadTs - 3000){
      showBubble(msg.from, msg.text);
      if(msg.from !== myId && !chatOpen){
        unreadCount++;
        updateUnreadBadge();
      }
    }
  });
}

/* ============================================================
   EMOJIS
   ============================================================ */
function buildEmojiBar(){
  const bar = document.getElementById("emojiBar");
  bar.innerHTML = "";
  EMOJIS.forEach(em=>{
    const b = document.createElement("button");
    b.className = "emojiBtn"; b.textContent = em;
    b.addEventListener("click", ()=>{
      const now = Date.now();
      players[myId].emoji = em; players[myId].emojiTs = now;
      if(db) db.ref("room/players/"+myId).update({ emoji: em, emojiTs: now });
    });
    bar.appendChild(b);
  });
}

/* ============================================================
   CHAT
   ============================================================ */
let chatOpen = false;
let unreadCount = 0;
const chatPanel = document.getElementById("chatPanel");
const chatLog = document.getElementById("chatLog");
const chatInput = document.getElementById("chatInput");

document.getElementById("chatToggleBtn").addEventListener("click", ()=>{
  chatOpen = !chatOpen;
  chatPanel.classList.toggle("open", chatOpen);
  if(chatOpen){ unreadCount=0; updateUnreadBadge(); chatLog.scrollTop = chatLog.scrollHeight; }
});
document.getElementById("chatCloseBtn").addEventListener("click", ()=>{
  chatOpen=false; chatPanel.classList.remove("open");
});
chatPanel.addEventListener("click",(e)=>{ if(e.target===chatPanel){ chatOpen=false; chatPanel.classList.remove("open"); } });

function updateUnreadBadge(){
  const badge = document.getElementById("unreadBadge");
  if(unreadCount>0){ badge.textContent = unreadCount>9 ? "9+" : unreadCount; badge.classList.add("show"); }
  else badge.classList.remove("show");
}

function appendChatLog(msg){
  const div = document.createElement("div");
  div.className = "chatMsg " + (msg.from===myId ? "mine" : "theirs");
  div.textContent = msg.text;
  chatLog.appendChild(div);
  chatLog.scrollTop = chatLog.scrollHeight;
}

function sendChat(){
  const text = chatInput.value.trim();
  if(!text || !db || !myId) return;
  db.ref("room/chat").push({ from: myId, text: text, ts: Date.now() });
  chatInput.value = "";
}
document.getElementById("chatSendBtn").addEventListener("click", sendChat);
chatInput.addEventListener("keydown",(e)=>{ if(e.key==="Enter") sendChat(); });

/* ============================================================
   BURBUJAS DE TEXTO SOBRE LOS PUNTOS
   ============================================================ */
const bubbles = {};
function showBubble(id, text){
  let el = bubbles[id];
  if(!el){
    el = document.createElement("div");
    el.className = "speechBubble";
    document.body.appendChild(el);
    bubbles[id] = el;
  }
  el.textContent = text;
  el.classList.add("show");
  clearTimeout(el._t);
  el._t = setTimeout(()=> el.classList.remove("show"), 4200);
}
function updateBubblePositions(){
  Object.keys(bubbles).forEach(id=>{
    const p = players[id];
    if(!p) return;
    const el = bubbles[id];
    el.style.left = (p.fx*W) + "px";
    el.style.top = (p.fy*H - 24) + "px";
  });
}

/* ============================================================
   AUDIO AMBIENTE (sintetizado, sin archivos externos)
   ============================================================ */
let audioCtx=null, masterGain=null;
let rainAmbGain=null, musicGain=null, fireGain=null;
let audioReady=false;
const soundState = { rain:false, music:false, fire:false };
try{
  const saved = JSON.parse(localStorage.getItem("nuestro_lugar_sound")||"{}");
  Object.assign(soundState, saved);
}catch(e){}

function unlockAudio(){
  if(audioReady) return;
  audioReady = true;
  try{
    audioCtx = new (window.AudioContext||window.webkitAudioContext)();
    masterGain = audioCtx.createGain(); masterGain.gain.value=0.8;
    masterGain.connect(audioCtx.destination);
    buildRainAmbience();
    buildMusicAmbience();
    buildFireAmbience();
    applySoundState();
  }catch(e){ audioCtx=null; }
}
function buildRainAmbience(){
  const bufferSize = audioCtx.sampleRate*2;
  const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
  const data = buffer.getChannelData(0);
  for(let i=0;i<bufferSize;i++) data[i]=(Math.random()*2-1)*0.6;
  const src = audioCtx.createBufferSource(); src.buffer=buffer; src.loop=true;
  const filter = audioCtx.createBiquadFilter(); filter.type="bandpass"; filter.frequency.value=1700; filter.Q.value=0.6;
  rainAmbGain = audioCtx.createGain(); rainAmbGain.gain.value=0.0001;
  src.connect(filter); filter.connect(rainAmbGain); rainAmbGain.connect(masterGain);
  src.start(0);
}
function buildMusicAmbience(){
  musicGain = audioCtx.createGain(); musicGain.gain.value=0.0001;
  musicGain.connect(masterGain);
  const notes = [220.00, 261.63, 329.63, 392.00]; // A3 C4 E4 G4 - Am7
  notes.forEach((freq,i)=>{
    const osc = audioCtx.createOscillator();
    osc.type = "sine"; osc.frequency.value = freq;
    const lfo = audioCtx.createOscillator();
    lfo.type="sine"; lfo.frequency.value = 0.05 + i*0.015;
    const lfoGain = audioCtx.createGain(); lfoGain.gain.value = 0.05;
    lfo.connect(lfoGain); lfoGain.connect(osc.detune);
    const noteGain = audioCtx.createGain(); noteGain.gain.value = 0.18 - i*0.02;
    osc.connect(noteGain); noteGain.connect(musicGain);
    osc.start(0); lfo.start(0);
  });
}
function buildFireAmbience(){
  fireGain = audioCtx.createGain(); fireGain.gain.value=0.0001;
  fireGain.connect(masterGain);

  const bufferSize = audioCtx.sampleRate*2;
  const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
  const data = buffer.getChannelData(0);
  for(let i=0;i<bufferSize;i++) data[i]=(Math.random()*2-1)*0.3;
  const src = audioCtx.createBufferSource(); src.buffer=buffer; src.loop=true;
  const filter = audioCtx.createBiquadFilter(); filter.type="lowpass"; filter.frequency.value=500;
  const hiss = audioCtx.createGain(); hiss.gain.value=0.5;
  src.connect(filter); filter.connect(hiss); hiss.connect(fireGain);
  src.start(0);

  function crackle(){
    if(!audioCtx) return;
    const dur = 0.05 + Math.random()*0.08;
    const buf = audioCtx.createBuffer(1, audioCtx.sampleRate*dur, audioCtx.sampleRate);
    const d = buf.getChannelData(0);
    for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*(1-i/d.length);
    const s = audioCtx.createBufferSource(); s.buffer=buf;
    const f = audioCtx.createBiquadFilter(); f.type="highpass"; f.frequency.value=800+Math.random()*1200;
    const g = audioCtx.createGain(); g.gain.value = 0.15+Math.random()*0.25;
    s.connect(f); f.connect(g); g.connect(fireGain);
    s.start();
    setTimeout(crackle, 180+Math.random()*900);
  }
  crackle();
}
function applySoundState(){
  if(!audioCtx) return;
  const t = audioCtx.currentTime;
  if(rainAmbGain) rainAmbGain.gain.linearRampToValueAtTime(soundState.rain?0.35:0.0001, t+0.6);
  if(musicGain) musicGain.gain.linearRampToValueAtTime(soundState.music?0.5:0.0001, t+0.8);
  if(fireGain) fireGain.gain.linearRampToValueAtTime(soundState.fire?0.6:0.0001, t+0.6);
  updateSoundButtons();
}
function updateSoundButtons(){
  document.getElementById("btnRain").classList.toggle("on", soundState.rain);
  document.getElementById("btnMusic").classList.toggle("on", soundState.music);
  document.getElementById("btnFire").classList.toggle("on", soundState.fire);
}
function toggleSound(key){
  unlockAudio();
  soundState[key] = !soundState[key];
  try{ localStorage.setItem("nuestro_lugar_sound", JSON.stringify(soundState)); }catch(e){}
  applySoundState();
}
document.getElementById("btnRain").addEventListener("click", ()=> toggleSound("rain"));
document.getElementById("btnMusic").addEventListener("click", ()=> toggleSound("music"));
document.getElementById("btnFire").addEventListener("click", ()=> toggleSound("fire"));
updateSoundButtons();

document.body.addEventListener("pointerdown", unlockAudio, { once:true });

})();
</script>
</body>
</html>
