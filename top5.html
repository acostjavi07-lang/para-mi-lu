<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Top 5 — Lu</title>
<style>
  :root{
    --bg1:#1a0508; --bg2:#3a0d12; --accent:#ff8a6a; --glow:#ff4d5e; --ink:#f6ece6; --ink-dim:#d8c3bd;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;
    background:radial-gradient(ellipse at 50% 20%, var(--bg2), var(--bg1) 75%);
    font-family:'Segoe UI',system-ui,-apple-system,Arial,sans-serif; color:var(--ink);}
  #app{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;}

  #particles{position:fixed;inset:0;z-index:1;pointer-events:none;}

  .slide{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center; opacity:0; pointer-events:none; transition:opacity .8s ease; z-index:2; padding:28px;}
  .slide.active{opacity:1; pointer-events:auto;}

  .kicker{font-size:0.78rem; letter-spacing:4px; color:var(--ink-dim); text-transform:uppercase; margin-bottom:10px;}
  .titleMain{font-size:clamp(1.7rem,7vw,3rem); font-weight:800; line-height:1.25; margin:0 0 30px 0;
    text-shadow:0 0 30px rgba(255,90,90,0.4);}
  .titleMain b{color:var(--glow);}

  .numberReveal{font-size:clamp(5rem,26vw,9rem); font-weight:900; color:var(--glow);
    text-shadow:0 0 50px rgba(255,80,90,0.7), 0 0 100px rgba(255,60,70,0.35);
    animation:pop 0.7s cubic-bezier(.2,1.6,.4,1) both;}
  @keyframes pop{0%{transform:scale(0.3) rotate(-8deg); opacity:0;}
    60%{transform:scale(1.15) rotate(3deg); opacity:1;}
    100%{transform:scale(1) rotate(0deg); opacity:1;}}

  .photoFrame{width:min(300px,72vw); border-radius:16px; overflow:hidden; margin:0 auto 22px auto;
    box-shadow:0 20px 50px rgba(0,0,0,0.55), 0 0 0 1px rgba(255,150,120,0.25), 0 0 40px rgba(255,90,80,0.25);
    animation:riseIn 0.9s ease both; background:#0c0405;}
  .photoFrame img{display:block; width:100%; height:auto;}
  @keyframes riseIn{from{opacity:0; transform:translateY(24px) scale(0.96);} to{opacity:1; transform:translateY(0) scale(1);}}

  .caption{font-size:clamp(1.05rem,4.4vw,1.35rem); max-width:480px; line-height:1.5; color:var(--ink);
    text-shadow:0 0 20px rgba(0,0,0,0.5); margin:0 auto 8px auto; animation:fadeUp 1s ease 0.3s both;}
  @keyframes fadeUp{from{opacity:0; transform:translateY(14px);} to{opacity:1; transform:translateY(0);}}

  .closingHeart{font-size:3.2rem; margin-bottom:14px; animation:beat 1.4s ease-in-out infinite;}
  @keyframes beat{0%,100%{transform:scale(1);}50%{transform:scale(1.12);}}

  button{font-family:inherit; font-size:1rem; padding:14px 30px; border-radius:30px; border:1px solid rgba(255,255,255,0.25);
    background:linear-gradient(180deg,#ff8a6a,#b8232f); color:#fff; font-weight:700; letter-spacing:1px;
    cursor:pointer; margin-top:26px; box-shadow:0 10px 26px rgba(180,30,40,0.4); min-height:50px;
    transition:transform .15s ease;}
  button:active{transform:scale(0.95);}
  button.ghost{background:rgba(255,255,255,0.08); box-shadow:none; border-color:rgba(255,255,255,0.2);}

  .hintTap{font-size:0.72rem; color:var(--ink-dim); letter-spacing:1px; margin-top:8px; opacity:0.7;}

  .progressDots{position:absolute; bottom:22px; left:0; right:0; display:flex; justify-content:center; gap:8px; z-index:3;}
  .dot{width:8px;height:8px;border-radius:50%; background:rgba(255,255,255,0.2); transition:background .3s;}
  .dot.on{background:var(--glow); box-shadow:0 0 10px var(--glow);}
</style>
</head>

  border-radius:50%;background:rgba(0,0,0,0.4);border:1px solid rgba(255,255,255,0.15);color:#f6ece6;
  display:flex;align-items:center;justify-content:center;font-size:1rem;text-decoration:none;">🏠</a>

<script>
(function(){
"use strict";
const slides = ["slide0","slideNum1","slidePhoto1","slideNum2","slidePhoto2","slideEnd"];
const dotsMap = [0,0,1,2,2,3];
let idx = 0;

function show(i){
  slides.forEach((id,n)=>{
    document.getElementById(id).classList.toggle("active", n===i);
  });
  document.querySelectorAll(".dot").forEach((d,n)=>{
    d.classList.toggle("on", n===dotsMap[i]);
  });
}

function next(){
  idx++;
  if(idx>=slides.length) idx = slides.length-1;
  show(idx);
  if(slides[idx]==="slideNum1" || slides[idx]==="slideNum2"){
    setTimeout(()=>{ idx++; show(idx); }, 1300);
  }
}

document.getElementById("btn0").addEventListener("click", next);
document.getElementById("btn1").addEventListener("click", next);
document.getElementById("btn2").addEventListener("click", next);
document.getElementById("btnRestart").addEventListener("click", ()=>{ idx=0; show(idx); });

/* partículas cálidas de fondo, sutiles */
const canvas = document.getElementById("particles");
const ctx = canvas.getContext("2d");
let W = window.innerWidth, H = window.innerHeight;
function resize(){ W=window.innerWidth; H=window.innerHeight; canvas.width=W; canvas.height=H; }
window.addEventListener("resize", resize);
resize();

const particles = [];
for(let i=0;i<36;i++){
  particles.push({
    x: Math.random()*W, y: Math.random()*H, r: 0.6+Math.random()*1.6,
    vy: -6-Math.random()*10, vx: -3+Math.random()*6, phase: Math.random()*Math.PI*2
  });
}
function loop(){
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle = "rgba(255,150,110,0.5)";
  for(const p of particles){
    p.phase += 0.02;
    p.x += (p.vx*0.02) + Math.sin(p.phase)*0.3;
    p.y += p.vy*0.02;
    if(p.y < -10){ p.y = H+10; p.x = Math.random()*W; }
    if(p.x < -10) p.x = W+10;
    if(p.x > W+10) p.x = -10;
    ctx.beginPath();
    ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
    ctx.fill();
  }
  requestAnimationFrame(loop);
}
loop();

show(0);
})();
</script>
